<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>All Bookings</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="logo">
        Royal Stay
    </div>

    <nav class="nav-links">

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/rooms}">
            Rooms
        </a>

        <a th:href="@{/booking}">
            Booking
        </a>

        <a th:href="@{/contact}">
            Contact
        </a>

    </nav>

    <a th:href="@{/booking}"
       class="nav-btn">

        Book Stay

    </a>

</header>

<!-- =========================
     BOOKINGS SECTION
========================= -->

<section class="rooms-header">

    <h1>
        All Bookings
    </h1>

    <p>
        View all customer bookings.
    </p>

</section>

<section class="rooms-section">

    <div class="table-container">

        <table class="booking-table">

            <thead>

            <tr>

                <th>ID</th>

                <th>Customer Name</th>

                <th>Check In</th>

                <th>Check Out</th>

                <th>Room Type</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="booking : ${bookings}">

                <td th:text="${booking.id}">
                    1
                </td>

                <td th:text="${booking.customerName}">
                    Praveen
                </td>

                <td th:text="${booking.checkInDate}">
                    2026-01-01
                </td>

                <td th:text="${booking.checkOutDate}">
                    2026-01-02
                </td>

                <td th:text="${booking.roomType}">
                    Deluxe Room
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</section>

</body>

</html>
