<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rooms - Royal Stay</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<!-- Navbar -->
<header class="navbar">

    <div class="logo">
        Royal Stay
    </div>

    <nav class="nav-links">

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/rooms}">
            Rooms
        </a>

        <a th:href="@{/booking}">
            Booking
        </a>

        <a th:href="@{/contact}">
            Contact
        </a>

    </nav>

    <a th:href="@{/booking}"
       class="nav-btn">
        Book Stay
    </a>

</header>

<!-- Rooms Header -->
<section class="rooms-header">

    <h1>
        Our Luxury Rooms
    </h1>

    <p>
        Experience comfort, elegance and premium hospitality.
    </p>

</section>

<!-- Rooms Section -->
<section class="rooms-section">

    <div class="room-container">

        <div class="room-card"
             th:each="room : ${rooms}">

            <!-- Room Image -->
            <div class="room-image">

                <img th:src="${room.imageUrl}"
                     alt="Room Image">

            </div>

            <!-- Room Details -->
            <div class="room-details">

                <h2 th:text="${room.name}">
                    Room Name
                </h2>

                <p>

                    <strong>Type:</strong>

                    <span th:text="${room.type}">
                        AC
                    </span>

                </p>

                <p>

                    <strong>Price:</strong>

                    ₹<span th:text="${room.price}">
                        5000
                    </span>

                    / Night

                </p>

                <a th:href="@{/booking}"
                   class="primary-btn">

                    Book Now

                </a>

            </div>

        </div>

    </div>

</section>

</body>

</html>
