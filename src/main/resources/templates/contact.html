<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="logo">
        Royal Stay
    </div>

    <nav class="nav-links">

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/rooms}">
            Rooms
        </a>

        <a th:href="@{/booking}">
            Booking
        </a>

        <a th:href="@{/contact}">
            Contact
        </a>

    </nav>

    <a th:href="@{/booking}"
       class="nav-btn">

        Book Stay

    </a>

</header>

<!-- =========================
     CONTACT SECTION
========================= -->

<section class="contact-page">

    <div class="contact-container">

        <h1>
            Contact Us
        </h1>

        <p>
            We'd love to hear from you.
            Send us a message.
        </p>

        <form th:action="@{/saveContact}"
              th:object="${contact}"
              method="post">

            <!-- Name -->

            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter Your Name"
                   required>

            <!-- Email -->

            <input type="email"
                   th:field="*{email}"
                   placeholder="Enter Your Email"
                   required>

            <!-- Subject -->

            <input type="text"
                   th:field="*{subject}"
                   placeholder="Enter Subject"
                   required>

            <!-- Message -->

            <textarea th:field="*{message}"
                      placeholder="Enter Your Message"
                      rows="5"
                      required>
            </textarea>

            <!-- Submit Button -->

            <button type="submit"
                    class="primary-btn">

                Send Message

            </button>

        </form>

    </div>

</section>

</body>

</html>
