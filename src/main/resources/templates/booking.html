<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Room Booking</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <div class="logo">
        Royal Stay
    </div>

    <nav class="nav-links">

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/rooms}">
            Rooms
        </a>

        <a th:href="@{/booking}">
            Booking
        </a>

        <a th:href="@{/contact}">
            Contact
        </a>

    </nav>

    <a th:href="@{/booking}"
       class="nav-btn">

        Book Stay

    </a>

</header>

<!-- =========================
     BOOKING SECTION
========================= -->

<section class="booking-page">

    <div class="booking-form-container">

        <h1>
            Book Your Room
        </h1>

        <form th:action="@{/saveBooking}"
              th:object="${booking}"
              method="post">

            <!-- Customer Name -->

            <input type="text"
                   th:field="*{customerName}"
                   placeholder="Enter Your Name">

            <span class="error"
                  th:if="${#fields.hasErrors('customerName')}"
                  th:errors="*{customerName}">
            </span>

            <!-- Check In Date -->

            <input type="date"
                   th:field="*{checkInDate}">

            <span class="error"
                  th:if="${#fields.hasErrors('checkInDate')}"
                  th:errors="*{checkInDate}">
            </span>

            <!-- Check Out Date -->

            <input type="date"
                   th:field="*{checkOutDate}">

            <span class="error"
                  th:if="${#fields.hasErrors('checkOutDate')}"
                  th:errors="*{checkOutDate}">
            </span>

            <!-- Room Type -->

            <select th:field="*{roomType}">

                <option value="">
                    Select Room
                </option>

                <option value="Single Room">
                    Single Room
                </option>

                <option value="Deluxe Room">
                    Deluxe Room
                </option>

                <option value="Luxury Suite">
                    Luxury Suite
                </option>

            </select>

            <span class="error"
                  th:if="${#fields.hasErrors('roomType')}"
                  th:errors="*{roomType}">
            </span>

            <!-- Submit Button -->

            <button type="submit"
                    class="primary-btn">

                Book Now

            </button>

        </form>

    </div>

</section>

</body>

</html>
